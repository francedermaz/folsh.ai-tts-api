spring.application.name=tts

# Database Configuration
# Default: H2 file-based database (for development)
# To use MySQL: Set MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DIALECT environment variables
# Or configure in external application.properties file
spring.datasource.url=${MYSQL_URL:jdbc:h2:file:./data/ttsdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA Configuration
# Dialect: H2 for file-based, MySQL when MYSQL_URL is set (must also set MYSQL_DIALECT)
# Spring Boot will auto-detect, but you can override with MYSQL_DIALECT
spring.jpa.database-platform=${MYSQL_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled by default for file-based H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cache Configuration
tts.cache.directory=cache

# Piper backend: true = PiperJNI (default), false = native piper CLI
tts.piper.use-jni=true
# Required when use-jni=false. Example: /usr/local/bin/piper
tts.piper.command=
# Extracted/loaded only when use-jni=true. For CLI mode, place voice.onnx + voice.onnx.json here yourself.
tts.piper.models-directory=./models
tts.piper.timeout-seconds=60

# Text normalization rules (JSON). If missing, defaults are copied from the JAR on startup.
# Edit this file while the app is running; changes reload automatically every 2 seconds.
# Set enabled=false to pass text to Piper unchanged (speak + /normalize).
tts.normalization.enabled=true
tts.normalization.rules-path=./config/normalization-rules.json
tts.normalization.rules-check-interval-ms=2000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
