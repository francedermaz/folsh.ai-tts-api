<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Flossk TTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #e5e5e5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: #ffffff;
            border: 3px solid #2a2a2a;
            border-radius: 0;
            box-shadow: 8px 8px 0px rgba(220, 53, 69, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #2a2a2a;
            padding-bottom: 15px;
        }
        
        .login-header h1 {
            color: #2a2a2a;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .login-header p {
            color: #666666;
            font-size: 12px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2a2a2a;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 3px solid #2a2a2a;
            border-radius: 0;
            font-size: 14px;
            background: #ffffff;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #dc3545;
            color: #ffffff;
            border: 3px solid #2a2a2a;
            border-radius: 0;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
            box-shadow: 4px 4px 0px #2a2a2a;
        }
        
        .btn-login:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #2a2a2a;
            background: #c82333;
        }
        
        .btn-login:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0px #2a2a2a;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 0;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 700;
            border: 3px solid #2a2a2a;
        }
        
        .alert-error {
            background-color: #ffffff;
            border-color: #dc3545;
            color: #dc3545;
        }
        
        .alert-success {
            background-color: #ffffff;
            border-color: #28a745;
            color: #28a745;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #666666;
            font-size: 11px;
            font-weight: 600;
            border-top: 2px solid #2a2a2a;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Admin Login</h1>
            <p>Flossk TTS Administration</p>
        </div>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>
        
        <div class="footer">
            <p>© 2026 Flossk TTS</p>
        </div>
    </div>
</body>
</html>
