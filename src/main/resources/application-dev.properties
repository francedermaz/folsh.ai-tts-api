# Development Profile - File-based H2 Database
# Use this profile for local development: --spring.profiles.active=dev

spring.application.name=tts

# Database Configuration - H2 File Mode (Development Only)
spring.datasource.url=jdbc:h2:file:./data/ttsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (Enabled for Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cache Configuration
tts.cache.directory=cache
